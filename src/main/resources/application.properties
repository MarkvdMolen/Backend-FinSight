spring.application.name=finsight
debug=true

# PostgreSQL configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# Open Banking is opt-in. Application ID and private key stay on the backend.
enable-banking.enabled=${ENABLE_BANKING_ENABLED:false}
enable-banking.application-id=${ENABLE_BANKING_APPLICATION_ID:}
enable-banking.private-key-path=${ENABLE_BANKING_PRIVATE_KEY_PATH:}
enable-banking.encryption-key=${ENABLE_BANKING_ENCRYPTION_KEY:}
enable-banking.redirect-url=${ENABLE_BANKING_REDIRECT_URL:https://localhost:8443/api/banking/rabobank/callback}
enable-banking.frontend-url=${ENABLE_BANKING_FRONTEND_URL:http://localhost:4200}
enable-banking.bank-name=${ENABLE_BANKING_BANK_NAME:Rabobank}
enable-banking.consent-days=${ENABLE_BANKING_CONSENT_DAYS:30}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Optional HTTPS callback connector; keeps the existing HTTP API on port 8080.
enable-banking.callback-tls-enabled=${ENABLE_BANKING_CALLBACK_TLS_ENABLED:false}
enable-banking.callback-tls-port=${ENABLE_BANKING_CALLBACK_TLS_PORT:8443}
enable-banking.callback-key-store=${ENABLE_BANKING_CALLBACK_KEY_STORE:}
enable-banking.callback-key-store-password=${ENABLE_BANKING_CALLBACK_KEY_STORE_PASSWORD:}
